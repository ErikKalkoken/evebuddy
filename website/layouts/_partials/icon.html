{{- /* Inline SVG icon from assets/icons/<name>.svg. Platform keys like "mac-intel" use their prefix. */ -}}
{{- $name := index (split . "-") 0 -}}
{{- with resources.Get (printf "icons/%s.svg" $name) -}}
{{- .Content | replaceRE ` id="[^"]*"` "" | replaceRE `<svg ` `<svg fill="currentColor" aria-hidden="true" ` | safeHTML -}}
{{- else -}}
{{- errorf "icon %q not found in assets/icons" $name -}}
{{- end -}}
