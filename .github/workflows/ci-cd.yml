# Main workflow for testing and releasing
# spellchecker: disable

name: CI/CD

env:
  GO_VERSION: "1.27.4"
  FYNE_TOOL_VERSION: "v1.7.3"
  NAME: "evebuddy"
  FULLNAME: "EVE Buddy"
  FULLNAME2: "EVE_Buddy" # for AppImage file, e.g. with spaces replaced by underscores

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Set version
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          [[ "$GITHUB_REF_NAME" == v* ]] || { echo "::error::Release tag must start with v: $GITHUB_REF_NAME"; exit 1; }
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Install go dependencies
        run: go mod download

      - name: Run tests
        run: go test -coverprofile=coverage.txt -tags migrated_fynedo ./...

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  package_linux:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Install Fyne tool
        run: go install fyne.io/tools/cmd/fyne@${{ env.FYNE_TOOL_VERSION }}

      - name: Package Fyne app
        env:
          JANICE_API_KEY: ${{ secrets.JANICE_API_KEY }}
        run: |
          fyne package --os linux --release --tags migrated_fynedo --app-version ${{ env.VERSION }} --metadata "janiceAPIKey=$JANICE_API_KEY"
          mv '${{ env.FULLNAME }}.tar.xz' ${{ env.NAME }}-${{ env.VERSION }}-linux-amd64.tar.xz

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}-linux
          path: ${{ env.NAME }}-${{ env.VERSION }}-linux-amd64.tar.xz
          if-no-files-found: error
          overwrite: true

  package_appimage:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-22.04 # oldest available image = best AppImage compatibility
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libfuse2

      - name: Install Fyne tool
        run: go install fyne.io/tools/cmd/fyne@${{ env.FYNE_TOOL_VERSION }}

      - name: Package Fyne app
        env:
          JANICE_API_KEY: ${{ secrets.JANICE_API_KEY }}
        run: fyne package --os linux --release --tags migrated_fynedo --app-version ${{ env.VERSION }} --metadata "janiceAPIKey=$JANICE_API_KEY"

      - name: Build AppImage
        run: tools/build_appimage.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}-appimage
          path: ${{ env.FULLNAME2 }}-${{ env.VERSION }}-x86_64.AppImage
          if-no-files-found: error
          overwrite: true

  package_windows:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          path-type: inherit
          update: true

      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Dependencies
        run: >
          pacman --noconfirm -Syu &&
          pacman --noconfirm -S git zip mingw-w64-x86_64-toolchain

      - name: Install Fyne tool
        run: go install fyne.io/tools/cmd/fyne@${{ env.FYNE_TOOL_VERSION }}

      - name: Package
        env:
          JANICE_API_KEY: ${{ secrets.JANICE_API_KEY }}
        run: fyne package --os windows --release --tags migrated_fynedo --app-version ${{ env.VERSION }} --metadata "janiceAPIKey=$JANICE_API_KEY"

      - name: ZIP package
        run: zip -j ${{ env.NAME }}-${{ env.VERSION }}-windows-x64.zip "${{ env.FULLNAME }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}-windows
          path: ${{ env.NAME }}-${{ env.VERSION }}-windows-x64.zip
          if-no-files-found: error
          overwrite: true

  package_darwin:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: intel64
    name: package_darwin_${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Fyne tool
        run: go install fyne.io/tools/cmd/fyne@${{ env.FYNE_TOOL_VERSION }}

      - name: Package app bundles
        env:
          JANICE_API_KEY: ${{ secrets.JANICE_API_KEY }}
        run: fyne package --os darwin --release --tags migrated_fynedo --app-version ${{ env.VERSION }} --metadata "janiceAPIKey=$JANICE_API_KEY"

      - name: ZIP app bundle
        run: zip --symlinks -r ${{ env.NAME }}-${{ env.VERSION }}-darwin-${{ matrix.arch }}.zip "${{ env.FULLNAME }}.app/"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}-darwin-${{ matrix.arch }}
          path: ${{ env.NAME }}-${{ env.VERSION }}-darwin-${{ matrix.arch }}.zip
          if-no-files-found: error
          overwrite: true

  package_android:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Download Android NDK
        run: |
          wget -nv https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip

      - name: Install Fyne tool
        run: go install fyne.io/tools/cmd/fyne@${{ env.FYNE_TOOL_VERSION }}

      - name: Package Fyne app
        env:
          JANICE_API_KEY: ${{ secrets.JANICE_API_KEY }}
        run: |
          export ANDROID_NDK_HOME="$PWD/android-ndk-r27c"
          fyne package --os android --release --tags migrated_fynedo --app-version ${{ env.VERSION }} --metadata "janiceAPIKey=$JANICE_API_KEY"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}-android
          path: ${{ env.FULLNAME2 }}.apk
          if-no-files-found: error
          overwrite: true

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      [
        test,
        package_appimage,
        package_linux,
        package_darwin,
        package_windows,
        package_android,
      ]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.test.outputs.version }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            ${{ env.NAME }}-${{ env.VERSION }}-windows-x64.zip
            ${{ env.FULLNAME2 }}-${{ env.VERSION }}-x86_64.AppImage
            ${{ env.NAME }}-${{ env.VERSION }}-linux-amd64.tar.xz
            ${{ env.NAME }}-${{ env.VERSION }}-darwin-arm64.zip
            ${{ env.NAME }}-${{ env.VERSION }}-darwin-intel64.zip
            ${{ env.FULLNAME2 }}.apk
