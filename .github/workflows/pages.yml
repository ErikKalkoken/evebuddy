# Builds the website with Hugo and deploys it to GitHub Pages.
# Pull requests only build the website, so they fail when it no longer builds.
# spellchecker: disable

name: Pages

env:
  HUGO_VERSION: "v0.170.1"

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  # Triggered by the release job in ci-cd.yml, since releases created with GITHUB_TOKEN don't trigger workflows.
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one after another; pull request builds cancel outdated runs of the same branch.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: .github/workflows/pages.yml # cache key follows HUGO_VERSION

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6

      - name: Fetch latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/releases/latest" > website/data/release.json

      - name: Build website
        run: >
          go run github.com/gohugoio/hugo@${{ env.HUGO_VERSION }} build
          --source website --minify
          ${{ steps.pages.outputs.base_url && format('--baseURL "{0}/"', steps.pages.outputs.base_url) || '' }}

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --index-files index.html --root-dir "${{ github.workspace }}/website/public" website/public

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
